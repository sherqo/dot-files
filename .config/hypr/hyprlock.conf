# hyprlock.conf — sherqo's config (merged + cleaned)
# bg: wall-122.jpg | palette: ink 111019 · bright bdbbcc · muted 82819f · fail ff7a8f

general {
    ignore_empty_input = true
    hide_cursor = true
    fail_timeout = 300
}

background {
    monitor =
    path = ~/media/img/wallpapers/wall-122.jpg
    blur_passes = 1
    blur_size = 2
    noise = 0x0.0117
    contrast = 0.95
    brightness = 0.55
    vibrancy = 0.08
    vibrancy_darkness = 0.0
    color = rgba(111019ff)
    zindex = -1
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(bdbbccff)
    font_size = 164
    font_family = CaskaydiaMono Nerd Font Propo
    position = 0, 350
    halign = center
    valign = center
    zindex = 3
}

# date
label {
    monitor =
    text = cmd[update:30000] echo "$(date '+%A, %d %B %Y')"
    color = rgba(a5a5bbff)
    font_size = 28
    font_family = CaskaydiaMono Nerd Font Propo
    position = 0, 220
    halign = center
    valign = center
    zindex = 3
}

# lock glyph
label {
    monitor =
    text = 󰌾
    color = rgba(bdbbccff)
    shadow_passes = 1
    shadow_boost = 0.5
    shadow_color = rgba(111019aa)
    font_size = 26
    font_family = CaskaydiaMono Nerd Font Propo
    position = 0, -150
    halign = center
    valign = center
    zindex = 2
}

# input field
input-field {
    monitor =
    size = 250, 45
    outline_thickness = 3
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = rgba(bdbbccff)
    check_color = rgba(c9c7d6ff)
    fail_color = rgba(ff7a8fff)
    placeholder_text =
    font_family = CaskaydiaMono Nerd Font Propo
    position = 0, -240
    halign = center
    valign = center
    zindex = 10
    fade_on_empty = true
    fade_timeout = 0
    rounding = 12
    shadow_passes = 2
    dots_size = 0.3
    dots_spacing = 0.25
    dots_center = true
}

# sherqo@rose (bottom left)
label {
    monitor =
    text = cmd[update:24000000] echo "$USER@$(uname -n)"
    color = rgba(bdbbccff)
    shadow_passes = 1
    shadow_boost = 0.5
    shadow_color = rgba(111019aa)
    font_size = 14
    font_family = CaskaydiaMono Nerd Font Propo
    position = 10, 10
    halign = left
    valign = bottom
    zindex = 2
}

# battery (bottom right, same style)
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/hyprlock/battery.sh
    color = rgba(bdbbccff)
    shadow_passes = 1
    shadow_boost = 0.5
    shadow_color = rgba(111019aa)
    font_size = 14
    font_family = CaskaydiaMono Nerd Font Propo
    position = -10, 10
    halign = right
    valign = bottom
    zindex = 2
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.22, 1, 0.36, 1
    bezier = easeInQuint, 0.55, 0, 0.92, 0.19
    animation = fadeIn, 1, 8, easeOutQuint
}