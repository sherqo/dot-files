<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- ─── Arabic body text ─────────────────────────────────────────────── -->
  <!-- Primary: Noto Sans Arabic (clean, standard) -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <!-- ─── Decorative Arabic deprioritized (Kufi/Naskh/Nastaliq) ──────── -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Noto Kufi Arabic</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>Noto Naskh Arabic</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>Noto Naskh Arabic UI</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>Noto Nastaliq Urdu</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <!-- ─── sans-serif: Latin first, Arabic fallback ─────────────────────── -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Liberation Sans</string>
      <string>Noto Sans Arabic</string>
      <string>IBM Plex Sans Arabic</string>
    </edit>
  </match>

  <!-- ─── serif fallback ──────────────────────────────────────────────── -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Serif</string>
    </edit>
  </match>

  <!-- ─── monospace ───────────────────────────────────────────────────── -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>CaskaydiaMono Nerd Font</string>
    </edit>
  </match>

  <!-- ─── system-ui / web fonts ───────────────────────────────────────── -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>

  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>

  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-monospace</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>

</fontconfig>
